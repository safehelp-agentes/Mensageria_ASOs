# =============================================================================
# SafeWork Bot Service — FastAPI + Traefik
#
# Expõe /chatwoot/webhook via HTTPS público (n8n.srv1564091.hstgr.cloud)
# para contornar a proteção SSRF do Chatwoot.
#
# Pré-requisito: rede n8n_default deve existir (criada pelo stack do n8n)
# Confirme com: docker network ls | grep n8n_default
#
# Primeiro uso:
#   cd /opt/safework/envio_ASO/docker/bot
#   docker build -t safework-bot .
#   docker compose up -d
# =============================================================================

services:
  bot-service:
    image: safework-bot
    working_dir: /app
    volumes:
      - /opt/safework/envio_ASO:/app:ro
    env_file:
      - /opt/safework/envio_ASO/.env
    environment:
      # Sobrescreve a URL pública do .env — dentro da rede Docker, fala direto
      # com o container do Chatwoot (nome resolvido via DNS interno, robusto
      # a mudança de IP), sem depender do Traefik/HTTPS nem de rotas de host.
      - CHATWOOT_BASE_URL=http://chatwoot_app:3000
    restart: unless-stopped
    networks:
      traefik_net:
        aliases:
          - bot-service
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.bot-chatwoot.rule=Host(`n8n.srv1564091.hstgr.cloud`) && PathPrefix(`/chatwoot`)"
      - "traefik.http.routers.bot-chatwoot.entrypoints=websecure"
      - "traefik.http.routers.bot-chatwoot.tls.certresolver=mytlschallenge"
      - "traefik.http.services.bot-chatwoot.loadbalancer.server.port=8001"
      - "traefik.docker.network=n8n_default"

networks:
  traefik_net:
    external: true
    name: n8n_default
