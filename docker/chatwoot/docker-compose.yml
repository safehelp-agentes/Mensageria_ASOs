# =============================================================================
# Chatwoot — CRM de chat para SafeWork
#
# Pré-requisitos:
#   1. Copie .env.chatwoot.example para .env.chatwoot e preencha os valores
#   2. Confirme o nome da rede Traefik com: docker network ls
#      (normalmente "n8n_default" se o stack n8n foi iniciado com esse nome)
#   3. Aponte o DNS de chat.srv1564091.hstgr.cloud para o IP do servidor
#
# Primeira execução:
#   docker compose -f docker-compose.yml up -d
#   docker compose -f docker-compose.yml logs -f chatwoot_app
#   Aguarde "Listening on 0.0.0.0:3000" e acesse https://chat.srv1564091.hstgr.cloud
#   Crie a conta admin e configure a inbox (veja README abaixo)
# =============================================================================

services:

  chatwoot_app:
    image: chatwoot/chatwoot:v4.15.1
    command: >
      sh -c "bundle exec rails db:chatwoot_prepare &&
             bundle exec rails s -p 3000 -b 0.0.0.0"
    env_file: .env.chatwoot
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - chatwoot_storage:/app/storage
    restart: unless-stopped
    depends_on:
      - chatwoot_postgres
      - chatwoot_redis
    networks:
      - chatwoot_internal
      - traefik_net          # rede do Traefik — ajuste se necessário
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.chatwoot.rule=Host(`chat.srv1564091.hstgr.cloud`)"
      - "traefik.http.routers.chatwoot.entrypoints=websecure"
      - "traefik.http.routers.chatwoot.tls.certresolver=letsencrypt"
      - "traefik.http.services.chatwoot.loadbalancer.server.port=3000"
      - "traefik.docker.network=n8n_default"   # ajuste ao nome real da rede Traefik

  chatwoot_worker:
    image: chatwoot/chatwoot:v4.15.1
    command: bundle exec sidekiq -C config/sidekiq.yml
    env_file: .env.chatwoot
    volumes:
      - chatwoot_storage:/app/storage
    restart: unless-stopped
    depends_on:
      - chatwoot_postgres
      - chatwoot_redis
    networks:
      - chatwoot_internal

  chatwoot_postgres:
    image: pgvector/pgvector:pg15
    environment:
      POSTGRES_DB: chatwoot
      POSTGRES_USER: chatwoot
      POSTGRES_PASSWORD: ${CHATWOOT_DB_PASSWORD}
    volumes:
      - chatwoot_postgres:/var/lib/postgresql/data
    restart: unless-stopped
    networks:
      - chatwoot_internal

  chatwoot_redis:
    image: redis:7-alpine
    command: redis-server --maxmemory 256mb --maxmemory-policy allkeys-lru
    volumes:
      - chatwoot_redis:/data
    restart: unless-stopped
    networks:
      - chatwoot_internal

volumes:
  chatwoot_storage:
  chatwoot_postgres:
  chatwoot_redis:

networks:
  chatwoot_internal:
    driver: bridge
  traefik_net:
    external: true
    name: n8n_default       # confirme com: docker network ls | grep traefik
