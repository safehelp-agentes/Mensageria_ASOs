<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SafeWork — CRM ASOs</title>
<link rel="icon" href="data:,">
<style>
:root{
  --ink-900:#0B0F1A; --ink-800:#11172A; --ink-700:#1A2238; --ink-600:#293048;
  --ink-500:#3A425C; --ink-400:#5A6485; --ink-300:#8C95B2; --ink-200:#C7CDDD;
  --ink-100:#E8EBF3; --ink-50:#F5F7FB;
  --accent:#0F746C; --accent-soft:#E1F0EE; --accent-deep:#0A5751;
  --amber-soft:#FFF4E0; --amber-700:#92400E;
  --rose-soft:#FCE9EC; --rose-700:#9F1239; --rose-200:#FECDD3;
  --radius-card:8px;
  --shadow-card:0 1px 2px rgba(11,15,26,.04), 0 4px 12px rgba(11,15,26,.04);
  --sidebar-w:340px;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  font-family:'Inter',ui-sans-serif,system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  -webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale;
  color:var(--ink-800);
  background:
    radial-gradient(60% 40% at 80% 0%, rgba(15,116,108,.10) 0%, rgba(15,116,108,0) 60%),
    radial-gradient(40% 40% at 0% 100%, rgba(4,71,146,.08) 0%, rgba(4,71,146,0) 60%),
    linear-gradient(180deg,#F5F7FB 0%, #EEF1F8 100%);
  overflow:hidden;
}
button{font-family:inherit;cursor:pointer}
input{font-family:inherit}
.scrollbar-soft::-webkit-scrollbar{width:6px;height:6px}
.scrollbar-soft::-webkit-scrollbar-thumb{background:rgba(11,15,26,.18);border-radius:999px}
.scrollbar-soft::-webkit-scrollbar-track{background:transparent}

.app{display:flex;flex-direction:column;height:100vh;padding:20px 28px}

/* HEADER */
.dash-header{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-bottom:16px;flex-wrap:wrap;flex-shrink:0}
.brand-block{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.brand-logo{height:42px;width:42px;border-radius:10px;background:var(--accent);color:#fff;display:flex;align-items:center;justify-content:center;box-shadow:var(--shadow-card)}
.brand-logo svg{width:22px;height:22px}
.brand-text{border-left:1px solid var(--ink-200);padding-left:14px}
.brand-eyebrow{font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:var(--ink-400);font-weight:500}
.brand-title{font-size:19px;font-weight:600;color:var(--ink-900);line-height:1.2;margin-top:2px}
.tab-strip{display:flex;align-items:center;gap:4px;background:var(--ink-50);padding:4px;border-radius:var(--radius-card);margin-left:8px}
.tab-btn{display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:500;color:var(--ink-500);padding:7px 14px;border-radius:var(--radius-card);background:transparent;border:none;transition:all .15s}
.tab-btn:hover{color:var(--ink-900)}
.tab-btn.active{background:#fff;color:var(--ink-900);box-shadow:0 1px 2px rgba(11,15,26,.06)}
.header-actions{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.status-pill{display:inline-flex;align-items:center;gap:8px;border-radius:999px;border:1px solid rgba(15,116,108,.20);background:var(--accent-soft);color:var(--accent-deep);font-size:12px;font-weight:500;padding:6px 12px}
.status-pill .dot{width:8px;height:8px;border-radius:50%;background:var(--accent)}
.header-meta{font-size:12px;color:var(--ink-400)}
.header-btn{display:inline-flex;align-items:center;gap:8px;background:#fff;border:1px solid var(--ink-200);border-radius:var(--radius-card);font-size:13px;font-weight:500;color:var(--ink-700);padding:8px 12px;transition:border-color .15s}
.header-btn:hover{border-color:var(--ink-300)}
.header-btn svg{width:14px;height:14px}

/* VIEWS */
.view{display:none;flex:1;min-height:0}
.view.active{display:flex;flex-direction:column;min-height:0}
.scroll{flex:1;min-height:0;overflow-y:auto;display:flex;flex-direction:column;gap:14px;padding-bottom:8px}

/* KPIs */
.kpi-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:14px;flex-shrink:0}
.kpi-card{background:#fff;border-radius:var(--radius-card);box-shadow:var(--shadow-card);padding:16px 18px;display:flex;flex-direction:column;gap:2px}
.kpi-label{font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.08em;color:var(--ink-400)}
.kpi-value{font-size:30px;font-weight:700;color:var(--ink-900);line-height:1.1;font-variant-numeric:tabular-nums;margin-top:4px}
.kpi-sub{font-size:11px;color:var(--ink-400);margin-top:2px}

/* Filtros */
.dash-filters{display:flex;align-items:flex-end;gap:10px;flex-wrap:wrap;flex-shrink:0;background:#fff;border-radius:var(--radius-card);box-shadow:var(--shadow-card);padding:12px 16px}
.filter-group{display:flex;flex-direction:column;gap:4px}
.filter-label{font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.08em;color:var(--ink-400)}
.filter-input{height:34px;padding:0 10px;border-radius:6px;border:1px solid var(--ink-200);font-size:13px;color:var(--ink-800);background:#fff;outline:none;min-width:130px}
.filter-input:focus{border-color:var(--accent)}
.filter-empresa{flex:1;min-width:180px}
.filter-clear{height:34px;padding:0 14px;border-radius:6px;border:1px solid var(--ink-200);background:#fff;font-size:12px;font-weight:500;color:var(--ink-500)}
.filter-clear:hover{background:var(--ink-50);color:var(--ink-800)}

.dash-row{display:grid;grid-template-columns:1fr 1fr;gap:14px;flex-shrink:0}
.panel-card{background:#fff;border-radius:var(--radius-card);box-shadow:var(--shadow-card);padding:16px 18px;display:flex;flex-direction:column;min-width:0}
.panel-card.full{grid-column:1/-1}
.card-title{font-size:13px;font-weight:600;color:var(--ink-900);margin-bottom:12px;flex-shrink:0}
.chart-wrap{min-height:180px}
.chart-empresa{max-height:300px;overflow-y:auto}

/* Tabela */
.data-table{width:100%;border-collapse:collapse}
.data-table th{font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.06em;color:var(--ink-400);padding:9px 12px;text-align:left;border-bottom:1px solid var(--ink-100);background:var(--ink-50);position:sticky;top:0;white-space:nowrap}
.data-table td{padding:9px 12px;font-size:13px;color:var(--ink-800);border-bottom:1px solid var(--ink-100)}
.data-table tbody tr:last-child td{border-bottom:none}
.data-table tbody tr:hover td{background:var(--ink-50)}
.td-mono{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:11px;color:var(--ink-500)}
.td-trunc{max-width:280px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.badge{font-size:11px;font-weight:600;padding:2px 9px;border-radius:999px}
.badge-green{background:var(--accent-soft);color:var(--accent-deep)}
.badge-amber{background:var(--amber-soft);color:var(--amber-700)}
.tbl-scroll{flex:1;min-height:0;overflow:auto}
.filter-chips{display:flex;gap:6px}
.chip-btn{font-size:12px;font-weight:500;padding:7px 12px;border-radius:var(--radius-card);background:#fff;color:var(--ink-500);border:1px solid var(--ink-200)}
.chip-btn.active{background:var(--accent);color:#fff;border-color:var(--accent)}

/* CONVERSAS (main-card) */
.main-card{flex:1;min-height:0;background:#fff;border-radius:var(--radius-card);box-shadow:var(--shadow-card);overflow:hidden;display:grid;grid-template-columns:var(--sidebar-w) 1fr}
.sidebar{display:flex;flex-direction:column;min-height:0;border-right:1px solid var(--ink-100);overflow:hidden}
.sidebar-tabs{display:flex;gap:6px;padding:12px;border-bottom:1px solid var(--ink-100)}
.stab{flex:1;font-size:12px;font-weight:500;padding:8px 10px;border-radius:var(--radius-card);background:#fff;color:var(--ink-500);border:1px solid var(--ink-200)}
.stab:hover:not(.active){background:var(--ink-50)}
.stab.active{background:var(--accent);color:#fff;border-color:var(--accent)}
.search-wrap{padding:12px;border-bottom:1px solid var(--ink-100)}
.search-inner{position:relative}
.search-inner svg{position:absolute;left:12px;top:50%;transform:translateY(-50%);width:14px;height:14px;color:var(--ink-400)}
.search-inner input{width:100%;background:#fff;border:1px solid var(--ink-200);border-radius:var(--radius-card);padding:8px 12px 8px 34px;font-size:13px;color:var(--ink-900);outline:none}
.search-inner input:focus{border-color:var(--accent)}
.conv-list{flex:1;min-height:0;overflow-y:auto}
.conv-item{width:100%;text-align:left;background:transparent;border:none;border-bottom:1px solid var(--ink-100);display:flex;gap:12px;align-items:flex-start;padding:12px;border-left:4px solid transparent;transition:background .12s}
.conv-item:hover{background:var(--ink-50)}
.conv-item.active{background:var(--accent-soft);border-left-color:var(--accent)}
.avatar{flex-shrink:0;width:40px;height:40px;border-radius:50%;background:var(--accent-soft);color:var(--accent-deep);display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:600}
.conv-info{flex:1;min-width:0}
.conv-row1{display:flex;align-items:baseline;justify-content:space-between;gap:8px}
.conv-name{font-size:14px;font-weight:500;color:var(--ink-900);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:1}
.conv-time{font-size:10px;color:var(--ink-400);flex-shrink:0}
.conv-num{font-size:12px;color:var(--ink-400);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.conv-preview{font-size:12px;color:var(--ink-500);margin-top:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:flex;align-items:center;gap:6px}
.conv-preview .you{color:var(--ink-400)}
.conv-preview .txt{flex:1;overflow:hidden;text-overflow:ellipsis}
.conv-badge{flex-shrink:0;background:var(--accent);color:#fff;font-size:10px;font-weight:600;border-radius:999px;min-width:18px;height:18px;padding:0 6px;display:inline-flex;align-items:center;justify-content:center}
.list-empty,.list-loading{padding:32px 16px;text-align:center;color:var(--ink-400);font-size:13px}
.list-error,.msg-error{padding:12px 16px;background:var(--rose-soft);color:var(--rose-700);font-size:13px;border-radius:var(--radius-card)}
.chat{display:flex;flex-direction:column;min-height:0;background:var(--ink-50)}
.chat-empty{flex:1;display:flex;align-items:center;justify-content:center;color:var(--ink-400);font-size:13px;padding:32px;text-align:center}
.chat-empty-stack{display:flex;flex-direction:column;align-items:center;gap:10px}
.chat-empty svg{width:44px;height:44px;color:var(--ink-300)}
.chat-header-bar{flex-shrink:0;display:flex;align-items:center;gap:12px;padding:12px 16px;background:#fff;border-bottom:1px solid var(--ink-100)}
.chat-header-bar .avatar{width:36px;height:36px;font-size:12px}
.chat-header-info{min-width:0;flex:1}
.chat-header-name{font-size:14px;font-weight:600;color:var(--ink-900);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chat-header-meta{font-size:12px;color:var(--ink-400);display:flex;align-items:center;gap:12px;margin-top:2px;flex-wrap:wrap}
.chat-header-meta strong{color:var(--ink-700);font-weight:600}
.tag{font-size:11px;background:var(--accent-soft);color:var(--accent-deep);padding:1px 8px;border-radius:10px}
.messages{flex:1;min-height:0;overflow-y:auto;padding:16px 24px;display:flex;flex-direction:column;gap:2px}
.msg-loading,.msg-empty{text-align:center;color:var(--ink-400);font-size:13px;padding:32px 16px}
.date-separator{display:flex;justify-content:center;margin:12px 0 8px}
.date-separator span{background:var(--ink-100);color:var(--ink-500);font-size:11px;padding:4px 12px;border-radius:999px;font-weight:500}
.msg-row{display:flex;margin:2px 0}
.msg-row.out{justify-content:flex-end}
.msg-row.in{justify-content:flex-start}
.msg-stack{max-width:70%;display:flex;flex-direction:column}
.bubble{padding:8px 12px;border-radius:16px;box-shadow:0 1px 2px rgba(11,15,26,.05);word-break:break-word}
.msg-row.out .bubble{background:var(--accent);color:#fff;border-bottom-right-radius:4px}
.msg-row.in .bubble{background:#fff;color:var(--ink-900);border:1px solid var(--ink-100);border-bottom-left-radius:4px}
.bubble-text{font-size:14px;line-height:1.5;white-space:pre-wrap}
.bubble-meta{font-size:10px;margin-top:4px;text-align:right;display:flex;align-items:center;justify-content:flex-end;gap:4px}
.msg-row.out .bubble-meta{color:rgba(225,240,238,.90)}
.msg-row.in .bubble-meta{color:var(--ink-400)}
.bubble-check svg{width:12px;height:12px}
.doc-bubble{display:flex;align-items:center;gap:10px;min-width:220px}
.doc-icon{width:36px;height:36px;border-radius:8px;flex-shrink:0;display:flex;align-items:center;justify-content:center}
.msg-row.out .doc-icon{background:rgba(255,255,255,.18);color:#fff}
.msg-row.in .doc-icon{background:var(--accent-soft);color:var(--accent-deep)}
.doc-icon svg{width:18px;height:18px}
.doc-info{min-width:0;flex:1}
.doc-name{font-size:13px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.doc-meta{font-size:11px;opacity:.75;margin-top:2px}

@media (max-width:900px){ .kpi-grid{grid-template-columns:repeat(2,1fr)} .dash-row{grid-template-columns:1fr} }
</style>
</head>
<body>
<div class="app">
  <header class="dash-header">
    <div class="brand-block">
      <div class="brand-logo">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
      </div>
      <div class="brand-text">
        <div class="brand-eyebrow">SafeWork</div>
        <div class="brand-title">CRM — ASOs</div>
      </div>
      <div class="tab-strip">
        <button class="tab-btn" id="tab-dashboard" onclick="trocarView('dashboard')">Dashboard</button>
        <button class="tab-btn active" id="tab-conversas" onclick="trocarView('conversas')">Conversas</button>
        <button class="tab-btn" id="tab-asos" onclick="trocarView('asos')">ASOs</button>
      </div>
    </div>
    <div class="header-actions">
      <span class="status-pill"><span class="dot"></span> Somente leitura</span>
      <span class="header-meta" id="clock"></span>
      <button class="header-btn" id="btn-refresh" onclick="refreshAtual()">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="23 4 23 10 17 10"/><polyline points="1 20 1 14 7 14"/><path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"/></svg>
        Atualizar
      </button>
    </div>
  </header>

  <!-- ══ DASHBOARD ══ -->
  <section class="view" id="view-dashboard">
    <div class="scroll scrollbar-soft">
      <div class="dash-filters">
        <div class="filter-group"><span class="filter-label">De</span><input type="date" id="df-inicio" class="filter-input" onchange="carregarDashboard()"></div>
        <div class="filter-group"><span class="filter-label">Até</span><input type="date" id="df-fim" class="filter-input" onchange="carregarDashboard()"></div>
        <div class="filter-group filter-empresa"><span class="filter-label">Empresa</span><input type="text" id="df-empresa" class="filter-input" placeholder="Nome ou código…" oninput="dashDebounce()"></div>
        <button class="filter-clear" onclick="limparFiltrosDash()">Limpar</button>
      </div>
      <div class="kpi-grid" id="kpi-grid"></div>
      <div class="dash-row">
        <div class="panel-card"><div class="card-title">Envios — últimos 30 dias</div><div class="chart-wrap" id="chart-dias"></div></div>
        <div class="panel-card"><div class="card-title">Top empresas por volume</div><div class="chart-wrap chart-empresa" id="chart-empresas"></div></div>
      </div>
      <div class="panel-card full">
        <div class="card-title">Envios recentes</div>
        <table class="data-table"><thead><tr><th>Empresa</th><th>Emissão</th><th>Envio</th><th>Status</th><th>Número</th></tr></thead><tbody id="dash-recentes"></tbody></table>
      </div>
    </div>
  </section>

  <!-- ══ CONVERSAS ══ -->
  <section class="view active" id="view-conversas">
    <div class="main-card">
      <aside class="sidebar">
        <div class="sidebar-tabs">
          <button class="stab active" id="stab-todos" onclick="filtrarAba('todos')">Todas</button>
          <button class="stab" id="stab-inbound" onclick="filtrarAba('inbound')">Com resposta</button>
        </div>
        <div class="search-wrap">
          <div class="search-inner">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
            <input id="search" type="text" placeholder="Buscar por nome ou número…" oninput="aplicarFiltros()">
          </div>
        </div>
        <div class="conv-list scrollbar-soft" id="conv-list"><div class="list-loading">Carregando…</div></div>
      </aside>
      <section class="chat" id="chat">
        <div class="chat-empty"><div class="chat-empty-stack">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
          <div>Selecione uma conversa para ver as mensagens</div>
        </div></div>
      </section>
    </div>
  </section>

  <!-- ══ ASOs ══ -->
  <section class="view" id="view-asos">
    <div class="view" style="display:flex;flex-direction:column">
      <div class="dash-filters" style="margin-bottom:14px">
        <div class="filter-chips">
          <button class="chip-btn active" id="ac-enviados" onclick="setAsoStatus('enviados')">Enviados</button>
          <button class="chip-btn" id="ac-pendentes" onclick="setAsoStatus('pendentes')">Pendentes</button>
          <button class="chip-btn" id="ac-todos" onclick="setAsoStatus('todos')">Todos</button>
        </div>
        <div class="filter-group filter-empresa"><span class="filter-label">Buscar</span><input type="text" id="aso-q" class="filter-input" placeholder="Empresa, código ou número…" oninput="asoDebounce()"></div>
        <span class="header-meta" id="aso-count"></span>
      </div>
      <div class="panel-card full" style="flex:1;min-height:0">
        <div class="tbl-scroll scrollbar-soft">
          <table class="data-table"><thead><tr><th>Empresa</th><th>Código</th><th>Emissão</th><th>Envio</th><th>Status</th><th>Número</th></tr></thead><tbody id="asos-body"></tbody></table>
        </div>
      </div>
    </div>
  </section>
</div>

<script>
const TZ='America/Sao_Paulo';
let viewAtual='conversas';
let todasConversas=[], convAtiva=null, abaFiltro='todos';
let asoStatus='enviados', _dashTimer=null, _asoTimer=null;

function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function initials(n){ const p=String(n||'').trim().split(/\s+/).filter(Boolean); if(!p.length)return '#'; return (p[0][0]+(p.length>1?p[p.length-1][0]:'')).toUpperCase(); }
function fmtHora(ms){ return ms? new Date(ms).toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit',timeZone:TZ}):''; }
function mesmaDataHoje(ms){ return new Date(ms).toLocaleDateString('pt-BR',{timeZone:TZ})===new Date().toLocaleDateString('pt-BR',{timeZone:TZ}); }
function fmtTempo(ms){ if(!ms)return ''; return mesmaDataHoje(ms)?fmtHora(ms):new Date(ms).toLocaleDateString('pt-BR',{day:'2-digit',month:'2-digit',timeZone:TZ}); }
function fmtDataDivisor(ms){ return new Date(ms).toLocaleDateString('pt-BR',{day:'2-digit',month:'long',year:'numeric',timeZone:TZ}); }
function dataChave(ms){ return new Date(ms).toLocaleDateString('pt-BR',{timeZone:TZ}); }
async function fetchJSON(url){ const r=await fetch(url,{headers:{'Accept':'application/json'}}); if(!r.ok){let m='HTTP '+r.status;try{const j=await r.json();if(j.erro)m=j.erro;}catch(e){}throw new Error(m);} return r.json(); }
function atualizarHora(){ document.getElementById('clock').textContent='Atualizado '+new Date().toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit',timeZone:TZ}); }

// ── Navegação de abas ──
function trocarView(v){
  viewAtual=v;
  ['dashboard','conversas','asos'].forEach(x=>{
    document.getElementById('view-'+x).classList.toggle('active', x===v);
    document.getElementById('tab-'+x).classList.toggle('active', x===v);
  });
  if(v==='dashboard') carregarDashboard();
  else if(v==='conversas'){ if(!todasConversas.length) carregarConversas(); }
  else if(v==='asos') carregarAsos();
}
function refreshAtual(){
  if(viewAtual==='dashboard') carregarDashboard();
  else if(viewAtual==='conversas'){ carregarConversas(); if(convAtiva) abrirConversa(convAtiva); }
  else carregarAsos();
}

// ── DASHBOARD ──
function dashDebounce(){ clearTimeout(_dashTimer); _dashTimer=setTimeout(carregarDashboard,350); }
function limparFiltrosDash(){ document.getElementById('df-inicio').value=''; document.getElementById('df-fim').value=''; document.getElementById('df-empresa').value=''; carregarDashboard(); }
async function carregarDashboard(){
  const qs=new URLSearchParams({inicio:document.getElementById('df-inicio').value||'',fim:document.getElementById('df-fim').value||'',empresa:document.getElementById('df-empresa').value||''});
  try{ const d=await fetchJSON('/api/dashboard?'+qs); atualizarHora(); renderDashboard(d); }
  catch(e){ document.getElementById('kpi-grid').innerHTML='<div class="list-error">Erro: '+esc(e.message)+'</div>'; }
}
function renderDashboard(d){
  const k=d.kpis;
  const cards=[
    ['Total Enviados',k.total,k.total_sub],
    ['Enviados Hoje',k.enviados_hoje,(k.enviados_hoje===1?'1 ASO hoje':k.enviados_hoje+' ASOs hoje')],
    ['Média por Empresa',k.media_empresa,'entre '+k.empresas+' empresa(s)'],
    ['Média Diária',k.media_diaria,'em '+k.dias_envio+' dia(s) com envio'],
    ['Empresas Atendidas',k.empresas,'no período'],
  ];
  document.getElementById('kpi-grid').innerHTML=cards.map(c=>
    '<div class="kpi-card"><div class="kpi-label">'+c[0]+'</div><div class="kpi-value">'+esc(c[1])+'</div><div class="kpi-sub">'+esc(c[2])+'</div></div>').join('');
  document.getElementById('chart-dias').innerHTML=svgBarras(d.serie);
  document.getElementById('chart-empresas').innerHTML=svgHBarras(d.top_empresas);
  const rec=d.recentes||[];
  document.getElementById('dash-recentes').innerHTML= rec.length? rec.map(a=>
    '<tr><td class="td-trunc">'+esc(a.empresa)+'</td><td>'+esc(a.data_emissao)+'</td><td>'+esc(a.data_envio)+'</td><td><span class="badge badge-green">Enviado</span></td><td class="td-mono">'+esc(a.numero)+'</td></tr>').join('')
    : '<tr><td colspan="5" style="text-align:center;color:var(--ink-400);padding:24px">Nenhum envio no período.</td></tr>';
}
function svgBarras(serie){
  if(!serie||!serie.length) return '<div class="list-empty">Sem dados.</div>';
  const w=640,h=180,pad=22,n=serie.length,max=Math.max(1,...serie.map(s=>s.valor)),bw=(w-pad*2)/n;
  let b='';
  serie.forEach((s,i)=>{ const bh=(h-pad*2)*(s.valor/max),x=pad+i*bw,y=h-pad-bh;
    b+='<rect x="'+(x+bw*0.15).toFixed(1)+'" y="'+y.toFixed(1)+'" width="'+(bw*0.7).toFixed(1)+'" height="'+Math.max(0,bh).toFixed(1)+'" rx="2" fill="var(--accent)"><title>'+s.dia+': '+s.valor+'</title></rect>';
    if(i%5===0||i===n-1) b+='<text x="'+(x+bw/2).toFixed(1)+'" y="'+(h-5)+'" font-size="9" text-anchor="middle" fill="var(--ink-400)">'+s.dia+'</text>';
  });
  return '<svg viewBox="0 0 '+w+' '+h+'" width="100%" preserveAspectRatio="xMidYMid meet">'+b+'</svg>';
}
function svgHBarras(top){
  if(!top||!top.length) return '<div class="list-empty">Sem dados.</div>';
  const w=640,rowH=26,pad=6,max=Math.max(1,...top.map(t=>t.valor)),h=pad*2+top.length*rowH,x0=200;
  let r='';
  top.forEach((t,i)=>{ const y=pad+i*rowH,bw=Math.max(2,(w-x0-40)*(t.valor/max));
    r+='<text x="0" y="'+(y+16)+'" font-size="11" fill="var(--ink-700)">'+esc(t.empresa.slice(0,30))+'</text>';
    r+='<rect x="'+x0+'" y="'+(y+4)+'" width="'+bw.toFixed(1)+'" height="16" rx="3" fill="var(--accent)"/>';
    r+='<text x="'+(x0+bw+6).toFixed(1)+'" y="'+(y+16)+'" font-size="11" fill="var(--ink-500)">'+t.valor+'</text>';
  });
  return '<svg viewBox="0 0 '+w+' '+h+'" width="100%">'+r+'</svg>';
}

// ── ASOs ──
function setAsoStatus(s){ asoStatus=s; ['enviados','pendentes','todos'].forEach(x=>document.getElementById('ac-'+x).classList.toggle('active',x===s)); carregarAsos(); }
function asoDebounce(){ clearTimeout(_asoTimer); _asoTimer=setTimeout(carregarAsos,350); }
async function carregarAsos(){
  const qs=new URLSearchParams({status:asoStatus,q:document.getElementById('aso-q').value||''});
  const body=document.getElementById('asos-body');
  body.innerHTML='<tr><td colspan="6" style="text-align:center;color:var(--ink-400);padding:24px">Carregando…</td></tr>';
  try{
    const d=await fetchJSON('/api/asos?'+qs); atualizarHora();
    document.getElementById('aso-count').textContent=d.exibidos+' de '+d.filtrados+(d.filtrados<d.total?(' (filtrado de '+d.total+')'):'');
    body.innerHTML= d.itens.length? d.itens.map(a=>
      '<tr><td class="td-trunc">'+esc(a.empresa)+'</td><td class="td-mono">'+esc(a.codigo)+'</td><td>'+esc(a.data_emissao)+'</td><td>'+esc(a.data_envio)+'</td><td><span class="badge '+(a.enviado?'badge-green':'badge-amber')+'">'+(a.enviado?'Enviado':'Pendente')+'</span></td><td class="td-mono">'+esc(a.numero)+'</td></tr>').join('')
      : '<tr><td colspan="6" style="text-align:center;color:var(--ink-400);padding:24px">Nenhum ASO encontrado.</td></tr>';
  }catch(e){ body.innerHTML='<tr><td colspan="6"><div class="msg-error">Erro: '+esc(e.message)+'</div></td></tr>'; }
}

// ── CONVERSAS ──
async function carregarConversas(){
  const list=document.getElementById('conv-list'); const btn=document.getElementById('btn-refresh'); btn.disabled=true;
  try{ todasConversas=await fetchJSON('/api/conversas'); atualizarHora(); aplicarFiltros(); }
  catch(e){ list.innerHTML='<div class="list-error">Erro: '+esc(e.message)+'</div>'; }
  finally{ btn.disabled=false; }
}
function filtrarAba(a){ abaFiltro=a; ['todos','inbound'].forEach(x=>document.getElementById('stab-'+x).classList.toggle('active',x===a)); aplicarFiltros(); }
function aplicarFiltros(){
  const q=(document.getElementById('search').value||'').toLowerCase().trim();
  let l=todasConversas;
  if(abaFiltro==='inbound') l=l.filter(c=>c.recebidas>0);
  if(q) l=l.filter(c=>(c.nome||'').toLowerCase().includes(q)||(c.numero||'').includes(q)||(c.preview||'').toLowerCase().includes(q));
  renderConversas(l);
}
function renderConversas(l){
  const el=document.getElementById('conv-list');
  if(!l.length){ el.innerHTML='<div class="list-empty">'+(abaFiltro==='inbound'?'Nenhuma conversa com resposta.':'Nenhuma conversa.')+'</div>'; return; }
  el.innerHTML=l.map(c=>{
    const at=convAtiva===c.numero?'active':'', you=c.preview_dir==='outbound'?'<span class="you">Você: </span>':'';
    const badge=c.recebidas>0?'<span class="conv-badge">'+(c.recebidas>99?'99+':c.recebidas)+'</span>':'';
    return '<button class="conv-item '+at+'" data-num="'+esc(c.numero)+'"><div class="avatar">'+esc(initials(c.nome))+'</div><div class="conv-info"><div class="conv-row1"><div class="conv-name">'+esc(c.nome)+'</div><div class="conv-time">'+fmtTempo(c.ts)+'</div></div><div class="conv-num">'+esc(c.numero)+'</div><div class="conv-preview">'+you+'<span class="txt">'+esc(c.preview)+'</span>'+badge+'</div></div></button>';
  }).join('');
  el.querySelectorAll('.conv-item').forEach(b=>b.addEventListener('click',()=>abrirConversa(b.dataset.num)));
}
async function abrirConversa(numero){
  convAtiva=numero; aplicarFiltros();
  const chat=document.getElementById('chat'); chat.innerHTML='<div class="msg-loading">Carregando mensagens…</div>';
  try{ const d=await fetchJSON('/api/conversa/'+encodeURIComponent(numero)); renderChat(d.meta,d.eventos); }
  catch(e){ chat.innerHTML='<div class="messages"><div class="msg-error">Erro: '+esc(e.message)+'</div></div>'; }
}
function renderChat(meta,eventos){
  const tags=(meta.empresas||[]).slice(0,4).map(e=>'<span class="tag">'+esc(e)+'</span>').join(' ');
  const extra=(meta.empresas||[]).length>4?'<span class="tag">+'+(meta.empresas.length-4)+'</span>':'';
  const chips=[].concat(meta.numero?['<span>'+esc(meta.numero)+'</span>']:[]).concat(meta.codigo?['Cód.: <strong>'+esc(meta.codigo)+'</strong>']:[]).concat(meta.cnpj?['CNPJ: <strong>'+esc(meta.cnpj)+'</strong>']:[]).join(' · ');
  let msgs='';
  if(!eventos.length) msgs='<div class="msg-empty">Sem mensagens.</div>';
  else{ let ud=''; for(const ev of eventos){ if(ev.ts){const dk=dataChave(ev.ts); if(dk!==ud){msgs+='<div class="date-separator"><span>'+fmtDataDivisor(ev.ts)+'</span></div>';ud=dk;}} msgs+=renderBolha(ev); } }
  document.getElementById('chat').innerHTML='<div class="chat-header-bar"><div class="avatar">'+esc(initials(meta.nome))+'</div><div class="chat-header-info"><div class="chat-header-name">'+esc(meta.nome)+'</div><div class="chat-header-meta">'+chips+'</div>'+(tags?'<div class="chat-header-meta" style="margin-top:4px">'+tags+' '+extra+'</div>':'')+'</div></div><div class="messages scrollbar-soft" id="msgs">'+msgs+'</div>';
  const c=document.getElementById('msgs'); if(c)c.scrollTop=c.scrollHeight;
}
function docCard(nome,count){
  const n=nome||'Documento';
  const meta=(count&&count>1)?'PDF · '+count+' ASOs':(/\.pdf$/i.test(n)?'PDF · ASO':'Documento');
  return '<div class="doc-bubble"><div class="doc-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/></svg></div><div class="doc-info"><div class="doc-name">'+esc(n)+'</div><div class="doc-meta">'+meta+'</div></div></div>';
}
function renderBolha(ev){
  const dir=ev.dir==='out'?'out':'in', hora=fmtHora(ev.ts);
  const check=dir==='out'?'<span class="bubble-check"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg></span>':'';
  const mostrarDoc=ev.tipo==='document'||(ev.arquivo&&!ev.texto);
  let corpo='';
  if(mostrarDoc) corpo+=docCard(ev.arquivo,ev.count);
  if(ev.texto) corpo+='<div class="bubble-text"'+(mostrarDoc?' style="margin-top:8px"':'')+'>'+esc(ev.texto)+'</div>';
  if(!corpo){ const t=ev.tipo&&ev.tipo!=='text'?'['+ev.tipo+']':''; corpo='<div class="bubble-text">'+esc(t)+'</div>'; }
  return '<div class="msg-row '+dir+'"><div class="msg-stack"><div class="bubble">'+corpo+'<div class="bubble-meta"><span>'+hora+'</span>'+check+'</div></div></div></div>';
}

// ── Init ──
carregarConversas();
setInterval(()=>{ if(viewAtual==='conversas'){ carregarConversas(); if(convAtiva) abrirConversa(convAtiva); } }, 30000);
</script>
